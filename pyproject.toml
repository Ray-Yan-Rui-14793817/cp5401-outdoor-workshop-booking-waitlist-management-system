[tool.pytest.ini_options]
testpaths = ["test_booking.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
source = ["booking"]

[tool.coverage.report]
show_missing = true
