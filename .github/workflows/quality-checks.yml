name: Quality Checks

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"
  REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}

jobs:
  quality-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out tested code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Record environment and code identity
        run: |
          mkdir -p reports
          python --version > reports/python-version.txt
          git rev-parse HEAD > reports/tested-sha.txt
          python -c "import json, os; from pathlib import Path; Path('reports/code-identity.json').write_text(json.dumps({key: os.environ.get(key) for key in ['GITHUB_SHA', 'REVIEW_HEAD_SHA', 'REVIEW_BASE_SHA', 'GITHUB_EVENT_NAME', 'GITHUB_RUN_ID']}, indent=2))"
      - name: Verify isolated runtime installation
        env:
          RUNTIME_ENV: ${{ runner.temp }}/outdoor-runtime
        run: |
          python -m venv "$RUNTIME_ENV"
          "$RUNTIME_ENV/bin/python" -m pip install --require-hashes -r requirements.txt
          "$RUNTIME_ENV/bin/python" -m pip check | tee reports/runtime-pip-check.txt
          "$RUNTIME_ENV/bin/python" -c "import app, booking, streamlit; print('Runtime-only imports passed.')" | tee reports/runtime-import.txt
          "$RUNTIME_ENV/bin/python" -m pip freeze > reports/runtime-versions.txt
      - name: Install locked development dependencies
        id: install
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip freeze > reports/installed-versions.txt
      - name: Lint application and tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m ruff check --output-format json --output-file reports/ruff.json app.py booking.py test_booking.py
      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m ruff format --check app.py booking.py test_booking.py
      - name: Check dependency consistency
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pip check | tee reports/pip-check.txt
      - name: Scan application code
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m bandit -f json -o reports/bandit.json app.py booking.py
      - name: Audit runtime lock
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pip_audit --strict --require-hashes --disable-pip -r requirements.txt --format json --output reports/pip-audit-runtime.json
      - name: Audit development lock
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pip_audit --strict --require-hashes --disable-pip -r requirements-dev.txt --format json --output reports/pip-audit-development.json
      - name: Require complete audit coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from packaging.utils import canonicalize_name
          from packaging.version import Version
          for lock, report in (
              ("requirements.txt", "reports/pip-audit-runtime.json"),
              ("requirements-dev.txt", "reports/pip-audit-development.json"),
          ):
              pins = re.findall(r"^([A-Za-z0-9_.-]+)(?:\[[^\]]+\])?==([^\s\\;]+)", Path(lock).read_text(), re.M)
              expected = {(canonicalize_name(name), Version(version)) for name, version in pins}
              rows = json.loads(Path(report).read_text())["dependencies"]
              if not expected or any("skip_reason" in row for row in rows):
                  raise SystemExit(f"Incomplete audit: {lock}")
              observed = {(canonicalize_name(row["name"]), Version(row["version"])) for row in rows}
              if observed != expected:
                  raise SystemExit(f"Audit differs from lock: {lock}")
              print(f"{lock}: all {len(expected)} locked packages audited; no omitted packages.")
          PY
      - name: Run foundation and Streamlit smoke tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest test_booking.py --junitxml=reports/junit.xml --cov=booking --cov-branch --cov-report=term-missing --cov-report=xml:reports/coverage.xml
      - name: Upload quality-checks evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
